name: Registro de usuarios con vectores faciales

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: 'Nombre completo (ej. Juan Pérez López)'
        required: true
      folder_name:
        description: 'Nombre de la carpeta en dataset/ (ej. usuario1)'
        required: true
      phone:
        description: 'Teléfono (opcional)'
        required: false
        default: ''
      email:
        description: 'Email (opcional)'
        required: false
        default: ''

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0
        pip install --upgrade pip
        pip install -r requerimientos.txt

    - name: Verificar estructura de proyecto
      run: |
        echo "Estructura del proyecto:"
        ls -R models/ || echo "No hay carpeta models/"
        ls -R dataset/ || echo "No hay carpeta dataset/"

    - name: Registro del usuario
      env:
        NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      run: |
        set -e
        COMANDO="python scripts/Registrar_usuarios.py \
          --full_name \"${{ inputs.full_name }}\" \
          --folder_name \"${{ inputs.folder_name }}\""
        
        [ -n "${{ inputs.phone }}" ] && COMANDO="$COMANDO --phone \"${{ inputs.phone }}\""
        [ -n "${{ inputs.email }}" ] && COMANDO="$COMANDO --email \"${{ inputs.email }}\""
        
        echo "Ejecutando: $COMANDO"
        eval $COMANDO || exit 1

    - name: Verificar resultado
      if: always()
      run: |
        echo "Estado de salida: $?"
