name: Clasificación facial

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL de la imagen (ej: https://github.com/user/repo/image.jpg)'
        required: true
      threshold:
        description: 'Umbral de confianza (0.5-0.9)'
        default: '0.7'

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          pip install -r scripts/requerimientos.txt
          pip install psycopg2-binary  # Asegura la instalación
          
      - name: Ejecutar clasificación
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/Clasificacion_rostro.py \
            --image_url "${{ inputs.image_url }}" \
            --threshold ${{ inputs.threshold }}
