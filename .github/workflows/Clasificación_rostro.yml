name: Clasificación Facial

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'URL de la imagen a clasificar'
        required: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar dependencias
        run: |
          pip install -r scripts/requerimientos.txt
          
      - name: Ejecutar clasificación
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/Clasificacion_rostro.py \
            --image_url "${{ inputs.image_url }}" \
            --threshold 0.7
            
          echo "Resultado: $?"
